<!DOCTYPE html><html lang="tr"><head><meta charset="UTF-8"><title>Rezervasyonlarim</title><link rel="stylesheet" href="/css/temel.css"></head><body>
<div id="ust-bar"></div><main class="kart"><h1>Rezervasyonlarim</h1><div id="mesaj" class="gizli"></div>
<div class="tablo-kaydir"><table><thead><tr><th>Tarih</th><th>Ogun</th><th>Yemekhane</th><th>Porsiyon</th><th>Ucret</th><th>Durum</th><th>Islem</th></tr></thead><tbody id="tablo"></tbody></table></div></main>
<script src="/js/ortak.js"></script><script>
oturumKontrol();ustMenuCiz("rezervasyonlar.html");
async function yukle(){try{const l=await apiIstek("/api/rezervasyonlar");tablo.innerHTML=l.map(r=>{let i="-";if(r.durum==="aktif")i=`<button class="dugme" onclick="iptal(${r.id})">Iptal Et</button>`;else if(r.durum==="kullanildi")i=r.puan?`Puan: ${r.puan}/5`:`<button class="dugme" onclick="puan(${r.menu_id})">Puan Ver</button>`;const porsiyonMetin = r.porsiyon === "yarim" ? "Yarım (%60)" : "Tam";return `<tr><td>${r.tarih}</td><td>${r.ogun_ad}</td><td>${r.yemekhane_ad}</td><td>${porsiyonMetin}</td><td>${r.ucret.toFixed(2)} TL</td><td><span class="etiket etiket-${r.durum}">${r.durum}</span></td><td>${i}</td></tr>`}).join("")}catch(e){mesajGoster("mesaj",e.message,true)}}
async function iptal(id){try{const r=await apiIstek(`/api/rezervasyonlar/${id}/iptal`,{method:"POST"});mesajGoster("mesaj",r.mesaj);await bakiyeYenile();yukle()}catch(e){mesajGoster("mesaj",e.message,true)}}
async function puan(mid){const p=Number(prompt("Puan (1-5):","5"));if(!p||p<1||p>5)return;const y=prompt("Yorum:","")||"";try{const r=await apiIstek("/api/degerlendirmeler",{method:"POST",body:JSON.stringify({menu_id:mid,puan:p,yorum:y})});mesajGoster("mesaj",r.mesaj);yukle()}catch(e){mesajGoster("mesaj",e.message,true)}}
yukle()
</script></body></html>
